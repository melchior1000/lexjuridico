name: Add ESLint commercial
on:
  push:
    branches:
      - chore/eslint-commercial
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-eslint-setup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/eslint-commercial
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar ESLint e configurar corte gradual
        shell: bash
        run: |
          npm install --save-dev eslint@^10.10.0 @eslint/js@^10.0.1 globals@^17.12.0
          node <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.scripts.lint='eslint lib/office-pipeline.js lib/office-command.js office-ui-v2.js office-flow-ui.js office-command-ui.js reception-handoff-ui.js login-theme.js';
          pkg.scripts.check='node scripts/check-syntax.js && npm run lint';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          cat > eslint.config.js <<'EOF'
          const js = require('@eslint/js');
          const globals = require('globals');

          const lexBrowserGlobals = {
            lexApi: 'readonly', getProcs: 'readonly', getPrep: 'readonly', ir: 'readonly', abrirProc: 'readonly',
            getResponsavel: 'readonly', lexEscape: 'readonly', toast: 'readonly', SK: 'readonly',
            setVersaoLocal: 'readonly', renderRecepcaoLex: 'readonly', getAuthToken: 'readonly',
            fetchComTimeout: 'readonly', SERVIDOR: 'readonly', crypto: 'readonly'
          };

          module.exports = [
            { ignores: ['bot.js','lex_agente_vivo*.js','node_modules/**'] },
            {
              files: ['lib/office-pipeline.js','lib/office-command.js'],
              languageOptions: { ecmaVersion: 'latest', sourceType: 'commonjs', globals: globals.node },
              rules: {
                ...js.configs.recommended.rules,
                'no-unused-vars': 'warn',
                'no-useless-escape': 'off'
              }
            },
            {
              files: ['office-ui-v2.js','office-flow-ui.js','office-command-ui.js','reception-handoff-ui.js','login-theme.js'],
              languageOptions: { ecmaVersion: 'latest', sourceType: 'script', globals: {...globals.browser,...lexBrowserGlobals} },
              rules: {
                'no-const-assign': 'error',
                'no-dupe-keys': 'error',
                'no-unreachable': 'error',
                'no-redeclare': 'error',
                'no-unused-vars': 'warn',
                'no-undef': 'off'
              }
            }
          ];
          EOF
          cat > test/eslint-pipeline.test.js <<'EOF'
          'use strict';
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const pkg=require('../package.json');

          test('pipeline executa sintaxe e ESLint no mesmo npm run check',()=>{
            assert.equal(typeof pkg.scripts.lint,'string');
            assert.match(pkg.scripts.check,/check-syntax\.js/);
            assert.match(pkg.scripts.check,/npm run lint/);
          });

          test('ESLint cobre a casca comercial crítica e preserva o monólito legado',()=>{
            const cfg=fs.readFileSync('eslint.config.js','utf8');
            for(const file of ['office-ui-v2.js','office-flow-ui.js','office-command-ui.js','reception-handoff-ui.js','login-theme.js','lib/office-pipeline.js']) assert.match(cfg,new RegExp(file.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')));
            assert.match(cfg,/bot\.js/);
            assert.match(cfg,/lex_agente_vivo/);
          });
          EOF
      - name: Validar
        run: npm run check
      - name: Testar
        run: npm test
      - name: Gravar corte
        shell: bash
        run: |
          git config user.name "melchior1000"
          git config user.email "melchior1000@users.noreply.github.com"
          git rm .github/workflows/add-eslint-commercial.yml
          git add package.json package-lock.json eslint.config.js test/eslint-pipeline.test.js
          git commit -m "chore: adiciona ESLint gradual ao CI [skip-eslint-setup]"
          git push origin chore/eslint-commercial