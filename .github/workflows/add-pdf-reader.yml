name: Add PDF reader
on:
  push:
    branches: [feat/documentos-leitura-segura]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/documentos-leitura-segura
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install pdf-parse@1.1.1 --save
      - run: npm run check
      - run: npm test
      - name: Commit dependency and remove temporary workflow
        run: |
          rm .github/workflows/add-pdf-reader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/add-pdf-reader.yml
          git commit -m "Documentos: adicionar parser de texto PDF"
          git push origin HEAD:feat/documentos-leitura-segura
