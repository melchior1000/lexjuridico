name: Append office command assets
on:
  push:
    branches:
      - feat/lex-office-commands
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lex-office-commands
      - name: Adicionar assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('office-ui.js')
          s=p.read_text()
          a="document.write('<script src=\"lib/office-command.js\"><\\/script>');"
          b="document.write('<script src=\"office-command-ui.js\"><\\/script>');"
          if a not in s:
              s=s.rstrip()+"\n"+a+"\n"+b+"\n"
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "melchior1000"
          git config user.email "melchior1000@users.noreply.github.com"
          git rm .github/workflows/append-office-command-assets.yml
          git add office-ui.js
          git commit -m "feat: carrega comandos operacionais do LEX [skip-assets]"
          git push origin feat/lex-office-commands
