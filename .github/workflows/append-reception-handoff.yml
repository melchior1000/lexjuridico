name: Append reception handoff
on:
  push:
    branches:
      - feat/reception-to-cadastro
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reception-to-cadastro
      - name: Carregar handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('office-ui.js');s=p.read_text();line="document.write('<script src=\"reception-handoff-ui.js\"><\\/script>');"
          if line not in s:s=s.rstrip()+"\n"+line+"\n"
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "melchior1000"
          git config user.email "melchior1000@users.noreply.github.com"
          git rm .github/workflows/append-reception-handoff.yml
          git add office-ui.js
          git commit -m "feat: carrega handoff Recepção Cadastro [skip-handoff]"
          git push origin feat/reception-to-cadastro
