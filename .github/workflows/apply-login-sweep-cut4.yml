name: Aplicar corte login e varredura

on:
  push:
    branches:
      - fix/login-light-no-sweep

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-cut4]') && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-light-no-sweep
      - name: Aplicar correções cirúrgicas
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '  setTimeout(varreduraInicial,2000);'
          if old not in s:
              raise SystemExit('agendamento legado da varredura não encontrado')
          s = s.replace(old, '  // Varredura legada removida do boot comercial.', 1)
          marker = '/* LOGIN CLARO COMERCIAL — CUT 4 */'
          css = r'''
/* LOGIN CLARO COMERCIAL — CUT 4 */
body.dia #login-screen{background:#f4f7fb!important;color:#0b1d33!important;}
body.dia #login-screen>div>div:nth-child(2){background:#fff!important;border-color:#d9e4ef!important;box-shadow:0 18px 45px rgba(15,35,60,.10)!important;}
body.dia #login-screen [style*="color:#e8eaf6"],body.dia #login-screen [style*="color: #e8eaf6"]{color:#0b1d33!important;}
body.dia #login-screen [style*="color:#555878"],body.dia #login-screen [style*="color: #555878"]{color:#69798d!important;}
body.dia #login-screen [style*="color:#4f6ef7"],body.dia #login-screen [style*="color: #4f6ef7"]{color:#176fda!important;}
body.dia #login-screen input,body.dia #login-screen select{background:#f7fbff!important;border-color:#cbd8e6!important;color:#0b1d33!important;box-shadow:none!important;}
body.dia #login-screen input::placeholder{color:#8797aa!important;}
body.dia #login-screen #btn-login{background:linear-gradient(135deg,#177ff0,#2861d8)!important;color:#fff!important;box-shadow:0 8px 20px rgba(23,127,240,.22)!important;}
body.dia #login-screen #olho-btn{color:#52657a!important;}
'''
          if marker not in s:
              pos = s.find('</style>')
              if pos < 0:
                  raise SystemExit('fim do style principal não encontrado')
              s = s[:pos] + css + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')

          test = Path('test/login-sweep-cut4.test.js')
          test.write_text("""'use strict';
const test=require('node:test');
const assert=require('node:assert/strict');
const fs=require('node:fs');
const path=require('node:path');

test('login possui modo dia comercial que vence estilos inline',()=>{
  const html=fs.readFileSync(path.join(__dirname,'../index.html'),'utf8');
  assert.match(html,/LOGIN CLARO COMERCIAL — CUT 4/);
  assert.match(html,/body\.dia #login-screen\{background:#f4f7fb!important/);
  assert.match(html,/#btn-login\{background:linear-gradient/);
  assert.match(html,/body\.dia #login-screen input,body\.dia #login-screen select/);
});

test('varredura legado não é mais agendada no boot',()=>{
  const html=fs.readFileSync(path.join(__dirname,'../index.html'),'utf8');
  assert.doesNotMatch(html,/setTimeout\(\s*varreduraInicial\s*,\s*2000\s*\)/);
  assert.match(html,/Varredura legada removida do boot comercial/);
});
""", encoding='utf-8')
      - name: Validar corte
        run: |
          npm ci
          npm run check
          npm test
      - name: Gravar correções na branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html test/login-sweep-cut4.test.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: login claro e remove varredura do boot [skip-cut4]"
          git push origin HEAD:fix/login-light-no-sweep
