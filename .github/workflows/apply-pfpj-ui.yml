name: Apply PF/PJ UI patch
on:
  push:
    branches: [fix/cadastro-pf-pj-20260910]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cadastro-pf-pj-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-pfpj-ui.js
      - name: Commit generated UI change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "LEX: concluir interface PF/PJ e ajustar fluxo PJe do escritório"
          git push origin HEAD:fix/cadastro-pf-pj-20260910
