name: Manter servidor do LEX acordado
# Paliativo para o plano gratuito do Render (o serviço dorme sem visitas). 24 h;
# o GitHub faz a visita externa a cada 5 minutos; o timer interno é apenas reforço.
# Não substitui um plano pago em produção.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Visitar /health
        env:
          LEX_URL: ${{ vars.LEX_SERVIDOR_URL || 'https://lex-juridico.onrender.com' }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 "$LEX_URL/health" || echo 000)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::warning::Servidor do LEX não respondeu /health"
