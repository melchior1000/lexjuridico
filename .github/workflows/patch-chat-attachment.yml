name: Patch chat attachment
on:
  push:
    branches: [feat/lex-chat-attachments]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[attachment-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lex-chat-attachments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ligar adaptador de anexo à casca
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let loader=fs.readFileSync('office-ui.js','utf8');
          const anchor="document.write('<script src=\"reception-handoff-ui.js\"><\\/script>');";
          const line="document.write('<script src=\"office-attachment-ui.js\"><\\/script>');";
          if(!loader.includes(line)){
            if(!loader.includes(anchor)) throw new Error('âncora do loader não encontrada');
            loader=loader.replace(anchor,anchor+'\n'+line);
          }
          fs.writeFileSync('office-ui.js',loader);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(!pkg.scripts.lint.includes('office-attachment-ui.js')) pkg.scripts.lint+=' office-attachment-ui.js';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          let lint=fs.readFileSync('eslint.config.js','utf8');
          lint=lint.replace("'reception-handoff-ui.js','login-theme.js'","'reception-handoff-ui.js','office-attachment-ui.js','login-theme.js'");
          fs.writeFileSync('eslint.config.js',lint);
          NODE
      - name: Validar
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Gravar
        shell: bash
        run: |
          git config user.name "melchior1000"
          git config user.email "melchior1000@users.noreply.github.com"
          git rm .github/workflows/patch-chat-attachment.yml
          git add office-ui.js package.json eslint.config.js
          git commit -m "feat: liga anexos ao chat central [attachment-patched]"
          git push origin feat/lex-chat-attachments
