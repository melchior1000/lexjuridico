name: Patch Datajud office
on:
  push:
    branches: [feat/datajud-office]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[datajud-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/datajud-office
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrar Datajud às rotas e ao lint
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const route='lib/office-routes.js';
          let s=fs.readFileSync(route,'utf8');
          const req="const Pipeline=require('./office-pipeline');";
          if(!s.includes("const Datajud=require('./datajud');")) s=s.replace(req,req+"\nconst Datajud=require('./datajud');");
          const marker="  if(path==='/api/escritorio/cadastro/conferir') {";
          const block=`  if(path==='/api/escritorio/datajud') {\n    if(!['admin','advogado','secretaria'].includes(profile)) {json(403,{error:'Perfil sem permissão para consultar o Datajud'});return true;}\n    if(req.method!=='POST') {json(405,{error:'Método não permitido'});return true;}\n    try{\n      const b=await deps.body(req);\n      const options={actor:profile,apiKey:deps.datajudApiKey??process.env.DATAJUD_API_KEY,fetchImpl:deps.datajudFetch||globalThis.fetch};\n      const result=b?.processo_id?await Datajud.syncProcess(deps.processStore,b.processo_id,options):await Datajud.syncRegistered(deps.processStore,options);\n      json(200,result);\n    }catch(e){json(e.status||422,{error:e.message});}\n    return true;\n  }\n`;
          if(!s.includes("path==='/api/escritorio/datajud'")){
            if(!s.includes(marker)) throw new Error('marcador da rota não encontrado');
            s=s.replace(marker,block+marker);
          }
          fs.writeFileSync(route,s);

          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(!pkg.scripts.lint.includes('lib/datajud.js')) pkg.scripts.lint=pkg.scripts.lint.replace('lib/office-command.js','lib/office-command.js lib/datajud.js');
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');

          let lint=fs.readFileSync('eslint.config.js','utf8');
          lint=lint.replace("files: ['lib/office-pipeline.js','lib/office-command.js']","files: ['lib/office-pipeline.js','lib/office-command.js','lib/datajud.js']");
          fs.writeFileSync('eslint.config.js',lint);
          NODE
      - name: Validar
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Gravar
        shell: bash
        run: |
          git config user.name "melchior1000"
          git config user.email "melchior1000@users.noreply.github.com"
          git rm .github/workflows/patch-datajud-office.yml
          git add lib/office-routes.js package.json eslint.config.js
          git commit -m "feat: integra Datajud ao fluxo do escritório [datajud-patched]"
          git push origin feat/datajud-office
