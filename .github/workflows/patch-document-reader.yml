name: Patch document reader
on:
  push:
    branches: [feat/documentos-leitura-segura]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/documentos-leitura-segura
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-document-reader.js
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Commit source and remove temporary patch machinery
        run: |
          rm scripts/patch-document-reader.js .github/workflows/patch-document-reader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js scripts/patch-document-reader.js .github/workflows/patch-document-reader.yml
          git commit -m "Documentos: bloquear análise sem leitura confirmada"
          git push origin HEAD:feat/documentos-leitura-segura
