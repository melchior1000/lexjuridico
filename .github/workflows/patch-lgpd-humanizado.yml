name: Patch LGPD humanizado
on:
  push:
    branches: [fix/whatsapp-lgpd-humanizado]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-lgpd-humanizado
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-lgpd-humanizado.js
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Commit patched source and remove temporary patch machinery
        run: |
          rm scripts/patch-lgpd-humanizado.js .github/workflows/patch-lgpd-humanizado.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.js scripts/patch-lgpd-humanizado.js .github/workflows/patch-lgpd-humanizado.yml
          git commit -m "WhatsApp: encerrar consentimento e humanizar classificacao"
          git push origin HEAD:fix/whatsapp-lgpd-humanizado
