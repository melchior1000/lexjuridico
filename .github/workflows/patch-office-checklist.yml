name: Patch office checklist flow
on:
  push:
    branches:
      - fix/office-checklist-actions
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-office-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/office-checklist-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Corrigir casca e verificação
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('office-ui-v2.js')
          s=p.read_text()

          old="function officeGrid(tasks,p){const busy=rx=>tasks.some(t=>!['concluida','falhou'].includes(t.status)&&rx.test(String(t.agente||t.tipo||t.instrucao||'')));const rows=[['Recepção','LEX Recepção',0,'cyan',/atend|recep/i],['Cadastro','LEX Cadastro',prep().length,'purple',/cadast|secret/i],['Iniciais','LEX Peticionamento',p.filter(x=>/inicial/i.test(String(x.setor||''))).length,'violet',/inicial|redac/i],['Processos','LEX Jurídico',p.filter(active).length,'green',/jurid|anal/i],['Prazos','LEX Controladoria',p.filter(x=>days(x)<=7).length,'amber',/prazo|control/i],['Peças / Perícia','LEX Perícia',tasks.filter(x=>/petic|peric|recurso|contest/i.test(String(x.tipo||x.instrucao||''))).length,'rose',/peric|redac|pesq/i],['Revisão','LEX Revisão',tasks.filter(x=>x.status==='aguardando_revisao').length,'blue',/revis/i],['Concluídos','LEX Finalização',p.filter(x=>!active(x)).length,'slate',/final|entreg/i]];return '<div class=\"lex-office-grid\">'+rows.map(r=>'<button class=\"tone-'+r[3]+'\" onclick=\"lexEscritorio()\"><span><strong>'+r[0]+'</strong><b>'+r[2]+'</b></span><small>'+r[1]+' <i class=\"'+(busy(r[4])?'busy':'')+'\"></i></small></button>').join('')+'</div>'}"
          new="function officeCounts(data){return data?.contagens?.setores||null}\nfunction officeGrid(tasks,p,counts){const busy=rx=>tasks.some(t=>!['concluida','falhou'].includes(t.status)&&rx.test(String(t.agente||t.tipo||t.instrucao||'')));const local={recepcao:0,cadastro:prep().length,iniciais:p.filter(x=>/inicial/i.test(String(x.setor||''))).length,processos:p.filter(active).length,prazos:p.filter(x=>days(x)<=7).length,pecas:tasks.filter(x=>/petic|recurso|contest/i.test(String(x.tipo||x.instrucao||''))).length,pericia:tasks.filter(x=>/peric|quesit/i.test(String(x.tipo||x.instrucao||''))).length,revisao:tasks.filter(x=>x.status==='aguardando_revisao').length,concluidos:p.filter(x=>!active(x)).length};const count=k=>counts?Number(counts[k]||0):Number(local[k]||0);const rows=[['Recepção','LEX Recepção',count('recepcao'),'cyan',/atend|recep/i],['Cadastro','LEX Cadastro',count('cadastro'),'purple',/cadast|secret/i],['Iniciais','LEX Peticionamento',count('iniciais'),'violet',/inicial|redac/i],['Processos','LEX Jurídico',count('processos'),'green',/jurid|anal/i],['Prazos','LEX Controladoria',count('prazos'),'amber',/prazo|control/i],['Peças / Perícia','LEX Produção',count('pecas')+count('pericia'),'rose',/peric|redac|pesq/i],['Revisão','LEX Revisão',count('revisao'),'blue',/revis/i],['Concluídos','LEX Finalização',count('concluidos'),'slate',/final|entreg/i]];return '<div class=\"lex-office-grid\">'+rows.map(r=>'<button class=\"tone-'+r[3]+'\" onclick=\"lexEscritorio()\"><span><strong>'+r[0]+'</strong><b>'+r[2]+'</b></span><small>'+r[1]+' <i class=\"'+(busy(r[4])?'busy':'')+'\"></i></small></button>').join('')+'</div>'}\nfunction officeBoardHtml(counts){if(!counts)return '';const items=[['Cadastro',counts.cadastro],['Iniciais',counts.iniciais],['Peças',counts.pecas],['Perícia',counts.pericia],['Revisão',counts.revisao],['Processos',counts.processos],['Prazos',counts.prazos],['Concluídos',counts.concluidos]];return '<div class=\"lex-panel lex-office-board\"><h2>Quadro do escritório</h2><div class=\"lex-office-board-grid\">'+items.map(x=>'<span><strong>'+esc(x[0])+'</strong><b>'+Number(x[1]||0)+'</b></span>').join('')+'</div></div>'}"
          if old not in s:
              raise SystemExit('officeGrid esperado não encontrado')
          s=s.replace(old,new,1)

          s=s.replace("const p=procs(),act=p.filter(active),soon=p.filter(x=>days(x)<=7).length;let tasks=[],reception=0;\n  try{const d=await lexApi('/api/trabalho');tasks=Array.isArray(d.tarefas)?d.tarefas:[]}catch{}", "const p=procs(),act=p.filter(active),soon=p.filter(x=>days(x)<=7).length;let tasks=[],reception=0,quadro=null;\n  try{const d=await lexApi('/api/trabalho');tasks=Array.isArray(d.tarefas)?d.tarefas:[];quadro=officeCounts(d)}catch{}",1)
          s=s.replace("+officeGrid(tasks,p)+'</section>';", "+officeGrid(tasks,p,quadro)+'</section>';",1)

          pattern=r"window\.lexEscritorio=async function\(\)\{.*?\};\nwindow\.lexSelectChatProcess"
          repl="""window.lexEscritorio=async function(){
  let tasks=[],quadro=null;
  try{const d=await lexApi('/api/trabalho');tasks=Array.isArray(d.tarefas)?d.tarefas:[];quadro=officeCounts(d)}catch{}
  const atividade=tasks.slice(0,12).map(t=>'<div class=\"lex-agent-row\"><i class=\"'+(['na_fila','executando'].includes(t.status)?'busy':'')+'\"></i><span><strong>'+esc(t.agente||'LEX')+'</strong><small>'+esc(t.processo_nome||t.instrucao||t.tipo||'Tarefa')+'</small></span><em>'+esc(t.status||'')+'</em></div>').join('')||'<div class=\"lex-empty\">Nenhuma tarefa em andamento.</div>';
  const body='<div class=\"lex-page-head\"><div><small>Fluxo completo</small><h1>Escritório</h1></div><button onclick=\"lexHome()\">⌂</button></div>'
    +'<div class=\"lex-coord\">'+bot('sm')+'<div><strong>LEX · Coordenador geral</strong><small>Recebe a ordem, distribui aos setores e devolve para sua revisão.</small></div></div>'
    +officeGrid(tasks,procs(),quadro)
    +officeBoardHtml(quadro)
    +'<div class=\"lex-panel\"><h2>Atividade dos agentes</h2>'+atividade+'</div>';
  shell('Escritório',body,'mais');
};
window.lexSelectChatProcess"""
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('lexEscritorio esperado não encontrado')
          p.write_text(s)

          Path('scripts/check-syntax.js').write_text("""const fs = require('node:fs');
const path = require('node:path');
const {spawnSync} = require('node:child_process');
let failures = 0, checked = 0;
function check(label, input, filename) {
  const r=spawnSync(process.execPath,['--check',...(filename ? [filename] : [])],{input,encoding:'utf8'});
  checked++;
  if(r.status!==0){failures++; console.error(label+'\\n'+r.stderr);}
}
const SKIP=new Set(['.git','node_modules','.vercel','coverage','dist','artifacts']);
function walk(dir='.'){
  const out=[];
  for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
    if(SKIP.has(entry.name)) continue;
    const full=path.join(dir,entry.name);
    if(entry.isDirectory()) out.push(...walk(full));
    else if(entry.isFile()&&entry.name.endsWith('.js')) out.push(full.replace(/^\.\\//,''));
  }
  return out;
}
const jsFiles=walk().sort();
for(const name of jsFiles) check(name,null,name);
for(const name of ['index.html','lex-whatsapp.html']) {
  const html=fs.readFileSync(name,'utf8'); let n=0;
  for(const match of html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script\\s*>/gi)) {
    if(/\\bsrc\\s*=/.test(match[1]) || /type\\s*=\\s*[\"'](?:application\\/json|application\\/ld\\+json|importmap)/i.test(match[1])) continue;
    check(name+' script '+(++n),match[2]);
  }
}
if(failures) process.exitCode=1;
else console.log('Sintaxe validada em '+checked+' unidades: todo JavaScript rastreado, casca comercial, fluxo do escritório, tema do login e scripts inline.');
""")

          Path('test/office-ui-structure.test.js').write_text("""'use strict';
const test=require('node:test');
const assert=require('node:assert/strict');
const fs=require('node:fs');
const ui=fs.readFileSync('office-ui-v2.js','utf8');
const syntax=fs.readFileSync('scripts/check-syntax.js','utf8');

test('Escritório monta quadro sem concatenação quebrada e usa contagem oficial',()=>{
  assert.match(ui,/function officeBoardHtml\(counts\)/);
  assert.match(ui,/officeGrid\(tasks,procs\(\),quadro\)/);
  assert.match(ui,/quadro=officeCounts\(d\)/);
  assert.doesNotMatch(ui,/officeGrid\(tasks,\s*procs\(\),\s*quadro\)[^;\n]*['\"]\s*\+\s*\(/);
});

test('check de sintaxe descobre JavaScript recursivamente em vez de lista fixa',()=>{
  assert.match(syntax,/function walk\(dir='\.'\)/);
  assert.match(syntax,/const jsFiles=walk\(\)\.sort\(\)/);
  assert.doesNotMatch(syntax,/for\(const name of \['bot\.js'/);
});
""")
          PY
      - name: Instalar dependências
        run: npm ci
      - name: Validar sintaxe
        run: npm run check
      - name: Rodar testes
        run: npm test
      - name: Gravar correção
        shell: bash
        run: |
          git config user.name "melchior1000"
          git config user.email "melchior1000@users.noreply.github.com"
          git rm .github/workflows/patch-office-checklist.yml
          git add office-ui-v2.js scripts/check-syntax.js test/office-ui-structure.test.js
          git commit -m "fix: estabiliza escritório comercial e valida toda a casca [skip-office-patch]"
          git push origin fix/office-checklist-actions
