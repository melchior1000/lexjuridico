name: Patch pericial standard
on:
  push:
    branches: [feat/pericia-padrao-institucional]
    paths:
      - 'scripts/patch-pericial-standard.js'
      - 'lib/pericial-standard.js'
      - 'test/pericial-standard.test.js'
      - '.github/workflows/patch-pericial-standard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pericia-padrao-institucional
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-pericial-standard.js
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Commit source and remove temporary patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/patch-pericial-standard.js .github/workflows/patch-pericial-standard.yml
          git add lib/task-engine.js scripts/patch-pericial-standard.js .github/workflows/patch-pericial-standard.yml
          git diff --cached --quiet || git commit -m 'Perícia: exigir padrão institucional antes da revisão'
          git push origin HEAD:feat/pericia-padrao-institucional
