name: Patch turno unico
on:
  push:
    branches: [feat/whatsapp-turno-unico]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whatsapp-turno-unico
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-turno-unico.js
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Commit source and remove temporary patch machinery
        run: |
          rm scripts/patch-turno-unico.js .github/workflows/patch-turno-unico.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/integration-status.js scripts/patch-turno-unico.js .github/workflows/patch-turno-unico.yml
          git commit -m "WhatsApp: uma resposta consolidada por turno"
          git push origin HEAD:feat/whatsapp-turno-unico
