name: Reverse audit temp
on:
  push:
    branches:
      - fix/reverse-audit-critical-1
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reverse-audit-critical-1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/patch-reverse-audit-temp.js
      - run: npm ci --ignore-scripts
      - run: npm run audit:reverse
      - run: npm run check
      - run: npm test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: fecha persistência do cadastro na reversa"
            git push origin HEAD:fix/reverse-audit-critical-1
          fi
