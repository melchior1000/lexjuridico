name: Temporary branch patcher
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-branch-patcher.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-context-integrity
      - name: Fix commercial quote escaping
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='office-ui-v2.js';
          let s=fs.readFileSync(p,'utf8');
          const from='\'"\':\'&quot\'';
          const to='\'"\':\'&quot;\'';
          if(!s.includes(from)) throw new Error('padrão antigo não encontrado');
          s=s.replace(from,to);
          if(s.includes(from)) throw new Error('ocorrência antiga restante');
          fs.writeFileSync(p,s);
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Commit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add office-ui-v2.js
          git commit -m "fix: corrige escape HTML comercial"
          git push origin HEAD:fix/chat-context-integrity
