name: Temporary login final patcher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-login-final-patcher.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-lightdom-final
          fetch-depth: 0
      - run: python3 scripts/patch-login-final.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: limpa login light DOM"
          git push origin HEAD:fix/login-lightdom-final
# rerun after contract update
